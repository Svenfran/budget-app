#datasource
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL82Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_deletes=true

#liquibase
spring.liquibase.enabled=true
spring.liquibase.contexts=dev
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

#logging
logging.level.com.github.svenfran.budgetapp.budgetappbackend=TRACE

#spring-security
logging.level.org.springframework.security=DEBUG

#brevo-email
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER}
brevo.sender.name=${BREVO_APP_NAME}

#cors
app.cors.allowed-origins=http://192.168.178.23:8100,http://192.168.178.21:8100,http://192.168.32.1:8100,http://localhost:8100,http://localhost:3000,http://localhost,http://192.168.178.23,https://192.168.178.23:8100,https://192.168.178.21:8100,https://192.168.32.1:8100,https://localhost:8100,https://localhost

#websocket
websocket.url=/ws

#actuator
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

#language
spring.messages.basename=messages
spring.messages.encoding=UTF-8

#scheduled-tasks
task.recurringCart.schedule=*/15 * * * * *
task.clearToken.schedule=0 0 * * * *

#port
server.address=0.0.0.0
server.port=9090
